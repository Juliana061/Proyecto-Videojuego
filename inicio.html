<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelZone - Inicio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark navbar-gamer">
    <div class="container">
      <span class="navbar-brand titulo-nav"> PixelZone</span>
      <div>
        <a href="inicio.html" class="btn btn-nav activo">Inicio</a>
        <a href="publicaciones.html" class="btn btn-nav">Posts</a>
        <a href="perfil.html" class="btn btn-nav">Perfil</a>
        <a href="index.html" class="btn btn-nav-salir">Salir</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row">

      <div class="col-lg-8">

        <div class="tarjeta tarjeta-nuevo-post">
          <h5> Nueva publicación</h5>
          <textarea id="textoPost" class="form-control campo-texto" rows="3"
            placeholder="¿Qué estás jugando hoy?"></textarea>
          <button onclick="publicar()" class="btn btn-success boton-publicar">Publicar</button>
        </div>

        <h5 class="titulo-seccion"> Publicaciones recientes</h5>
        <div id="feed"></div>

      </div>

      <!-- SIDEBAR -->
      <div class="col-lg-4 d-none d-lg-block">
        <div class="tarjeta">
          <h5>Trending</h5>
          <ul class="lista-trending">
            <li>#EldenRing</li>
            <li>#Valorant</li>
            <li>#Cyberpunk</li>
            <li>#GamePass</li>
            <li>#HollowKnight</li>
          </ul>
        </div>
      </div>

    </div>
  </main>

  <footer class="pie-pagina">
    <small>© 2026 PixelZone · Hecho para gamers</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
