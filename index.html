<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelZone - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="contenedor-login">

    <h1 class="titulo">🎮 PixelZone</h1>
    <p class="subtitulo">La red social gamer</p>

    <div class="tarjeta">
      <h2 class="titulo-tarjeta">Iniciar sesión</h2>

      <div class="grupo-campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" class="form-control" placeholder="gamertag" />
        <p id="errorUsuario" class="mensaje-error"></p>
      </div>

      <div class="grupo-campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" class="form-control" placeholder="••••••" />
        <p id="errorContrasena" class="mensaje-error"></p>
      </div>

      <p id="errorGeneral" class="mensaje-error"></p>

      <button onclick="iniciarSesion()" class="btn btn-success boton-login">
         Entrar al juego
      </button>

      <p class="texto-ayuda">
        Credenciales de prueba: <strong>gamer1</strong> / <strong>123456</strong>
      </p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
